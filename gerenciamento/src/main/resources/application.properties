# =====================================================================
# Configuração SEM segredos (versionada).
# Os valores sensíveis vêm de variáveis de ambiente OU do arquivo
# application-local.properties (que fica FORA do versionamento).
#
# Por padrão o perfil "local" é ativado e carrega o application-local.properties.
# Em produção, defina SPRING_PROFILES_ACTIVE=prod e forneça as variáveis
# de ambiente (DB_URL, DB_USERNAME, DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD...).
# =====================================================================

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ---------------- Banco de dados (PostgreSQL / Neon) ----------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---------------- E-mail (SMTP) ----------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ---------------- Integração WhatsApp (Evolution API) ----------------
# Defina WHATSAPP_ENABLED=true depois de configurar a instância da Evolution API.
whatsapp.api.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api.url=${WHATSAPP_URL:http://localhost:8081}
whatsapp.api.instance=${WHATSAPP_INSTANCE:webarber}
whatsapp.api.token=${WHATSAPP_TOKEN:}
