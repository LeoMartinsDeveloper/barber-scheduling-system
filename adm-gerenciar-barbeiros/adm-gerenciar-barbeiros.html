<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - Gerenciamento de Barbeiros</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
  />
</head>

<body class="bg-gray-50 font-sans text-gray-900" data-active-page="barbeiros">

<div class="flex h-screen overflow-hidden">

  <!-- Sidebar (injetada por admin-sidebar.js) -->
  <div id="sidebar-root"></div>

  <!-- Conteúdo -->
  <main class="flex-1 overflow-y-auto p-8">

    <div class="max-w-7xl mx-auto">

      <div class="flex justify-between items-center mb-10">

        <h1 class="text-3xl font-bold">
          Gerenciamento de Barbeiros
        </h1>

        <button
          id="btn-novo-barbeiro"
          class="bg-black text-white px-5 py-3 rounded-xl hover:bg-gray-800 transition flex items-center gap-2">
          
          <i class="fas fa-plus"></i>
          Novo barbeiro

        </button>

      </div>

      <div
        id="lista-barbeiros"
        class="grid lg:grid-cols-2 gap-8">

      </div>


    </div>

  </main>

</div>

<script src="../admin-sidebar.js"></script>
<script type="module" src="barbeiros.js"></script>
</body>
</html>
