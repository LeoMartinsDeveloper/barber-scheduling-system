<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - Agendamentos</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <link rel="icon" type="image/png" href="../assets main page/barbafavicon.png">
</head>

<body class="bg-gray-50 font-sans m-0 p-0 text-gray-900" data-active-page="agendamentos">

<div class="flex h-screen w-full overflow-hidden">

  <!-- Sidebar (injetada por admin-sidebar.js) -->
  <div id="sidebar-root"></div>

  <!-- Conteúdo -->
  <main class="flex-1 h-screen overflow-y-auto p-8">

    <div class="max-w-6xl mx-auto">

      <!-- Cabeçalho -->
      <div class="flex justify-between items-center mb-10">
        <h1 class="text-3xl font-bold">Gerenciamento de Agendamentos</h1>
      </div>

      <!-- Filtros -->
      <section class="bg-white rounded-2xl border border-gray-200 p-6 mb-8 shadow-sm">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-2">Pesquisar cliente</label>
            <input id="filtro-cliente" type="text" placeholder="Digite o nome do cliente..."
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-black" />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2">Barbeiro</label>
            <select id="filtro-barbeiro"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-black">
              <option value="">Todos</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2">Data</label>
            <input id="filtro-data" type="date"
              class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:border-black" />
          </div>
        </div>
      </section>

      <!-- Lista de Agendamentos -->
      <section id="lista-agendamentos" class="space-y-6">
        <p class="text-gray-400">Carregando...</p>
      </section>

    </div>

  </main>

</div>

<!-- Modal de edição -->
<div id="modal-editar"
  class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-3xl w-full max-w-lg p-8 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold">Editar agendamento</h2>
      <button id="fechar-modal-editar" class="text-gray-400 hover:text-black">
        <i class="fas fa-times text-xl"></i>
      </button>
    </div>

    <form id="form-editar" class="space-y-4">
      <input type="hidden" id="edit-id" />

      <div>
        <label class="block text-sm font-semibold mb-2">Nome</label>
        <input id="edit-nome" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Email</label>
          <input id="edit-email" type="email" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Telefone</label>
          <input id="edit-telefone" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Barbeiro</label>
          <input id="edit-barbeiro" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Serviços</label>
          <input id="edit-servicos" type="text" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-2">Data</label>
          <input id="edit-data" type="date" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Horário</label>
          <input id="edit-horario" type="time" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Valor (R$)</label>
          <input id="edit-valor" type="number" step="0.01" class="w-full border border-gray-300 rounded-xl px-4 py-3" />
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4">
        <button type="button" id="cancelar-modal-editar"
          class="px-6 py-3 border border-gray-300 rounded-xl hover:bg-gray-50 transition">Cancelar</button>
        <button type="submit"
          class="bg-black text-white px-6 py-3 rounded-xl hover:bg-gray-800 transition">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script src="../admin-sidebar.js"></script>
<script type="module" src="agendamentos-adm.js"></script>
</body>
</html>
