<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo - Bloquear Horários</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

    <link rel="icon" type="image/png" href="../assets main page/barbafavicon.png" />
  </head>
  <body class="bg-gray-50 font-sans m-0 p-0 text-gray-900" data-active-page="bloquear-horarios">
    <div class="flex h-screen w-full overflow-hidden">

      <!-- Sidebar (injetada por admin-sidebar.js) -->
      <div id="sidebar-root"></div>

      <main class="flex-1 h-screen overflow-y-auto p-8">
        <div class="max-w-4xl mx-auto w-full">
          <div class="mb-10">
            <h1 class="text-3xl font-bold text-gray-900">Bloquear horários</h1>
            <p class="text-gray-500 mt-1">
              Selecione um profissional, um dia e os horários que deseja tornar indisponíveis.
            </p>
          </div>

          <section class="mb-10">
            <h2 class="text-xl font-bold text-center text-gray-900 mb-6">
              Selecione um profissional
            </h2>
            <div id="lista-barbeiros-adm"
              class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              <p class="text-gray-400 col-span-full text-center">Carregando profissionais...</p>
            </div>
          </section>

          <section class="mb-20">
            <h2 class="text-xl font-bold text-center text-gray-900 mb-6">
              Selecione dia e horário
            </h2>

            <div id="calendario-adm"
              class="bg-white p-4 rounded-xl border border-gray-200 mb-6 max-w-sm mx-auto w-full shadow-sm">
              <div class="flex items-center justify-between mb-4">
                <h3 id="calendar-month-year" class="font-bold text-gray-900 text-sm"></h3>
                <div class="flex gap-0.5">
                  <button id="btn-prev-month" type="button"
                    class="p-1.5 text-gray-600 hover:bg-gray-100 rounded-lg transition text-xs">
                    <i class="fas fa-chevron-left"></i>
                  </button>
                  <button id="btn-next-month" type="button"
                    class="p-1.5 text-gray-600 hover:bg-gray-100 rounded-lg transition text-xs">
                    <i class="fas fa-chevron-right"></i>
                  </button>
                </div>
              </div>
              <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-gray-400 mb-2">
                <div>DOM</div><div>SEG</div><div>TER</div><div>QUA</div>
                <div>QUI</div><div>SEX</div><div>SÁB</div>
              </div>
              <div id="calendar-days-grid" class="grid grid-cols-7 gap-1"></div>
            </div>

            <div id="grade-horarios" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-3 mb-8"></div>

            <div class="flex justify-end">
              <button id="btn-salvar-bloqueios"
                class="w-full sm:w-auto bg-black text-white px-8 py-3 rounded-xl font-medium hover:bg-gray-800 transition flex items-center justify-center gap-2 shadow-sm">
                <i class="fas fa-save"></i> Salvar alterações
              </button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="../admin-sidebar.js"></script>
    <script src="adm-bloqueio.js"></script>
  </body>
</html>
